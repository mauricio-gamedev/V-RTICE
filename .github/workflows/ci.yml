name: VÉRTICE CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "refactor/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Android build + backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vertice_ci
          POSTGRES_USER: vertice
          POSTGRES_PASSWORD: vertice_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vertice -d vertice_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/vertice_ci
      TEST_DATABASE_USER: vertice
      TEST_DATABASE_PASSWORD: vertice_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android and run backend tests
        run: |
          gradle --no-daemon \
            :android:app:assembleDebug \
            :backend:app:test

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vertice-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
